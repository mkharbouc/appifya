name: 'Appifya 24/7 Platform Health Probe'

on:
  schedule:
    # Run every 2 hours automatically (12 times a day)
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  probe:
    name: 'Probe Live Service & Cloud Engine'
    runs-on: ubuntu-latest
    steps:
      - name: 'Probe Production Gateway & Cloudflare Edge'
        run: |
          PROBE_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36 (AppifyaHealthProbe/1.0)"
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" -A "$PROBE_UA" https://www.appifya.app)
          echo "Production edge response code: $HTTP_STATUS"
          # Valid edge states: 200 (OK), 301/308 (Redirect), 403 (Cloudflare Bot Challenge on datacenter runner IP)
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 308 ] || [ "$HTTP_STATUS" -eq 301 ]; then
            echo "✅ Edge Gateway is active and serving traffic."
          elif [ "$HTTP_STATUS" -eq 403 ]; then
            echo "ℹ️ Cloudflare Bot Challenge active on GitHub Actions datacenter IP (HTTP 403). Edge security is operational."
          else
            echo "::error::Appifya edge service returned outage status: $HTTP_STATUS"
            exit 1
          fi

      - name: 'Verify Live Platform Diagnostics & Cloud Runner Engine'
        run: |
          PROBE_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36 (AppifyaHealthProbe/1.0)"
          HTTP_CODE=$(curl -s -L -o /tmp/health_response.json -w "%{http_code}" -A "$PROBE_UA" https://www.appifya.app/api/health)
          RESPONSE=$(cat /tmp/health_response.json)
          echo "API Diagnostics HTTP Code: $HTTP_CODE"
          echo "Health probe response body: $RESPONSE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Health API endpoint unreachable or failed with status $HTTP_CODE"
            exit 1
          fi
          
          STATUS=$(echo "$RESPONSE" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Overall Health Status: $STATUS"
          
          if [ "$STATUS" = "action_required" ]; then
            echo "::error::Appifya health probe reports action_required! Check GitHub PAT or database settings."
            exit 1
          fi
          echo "✅ Platform, Database, and Cloud Engine verified healthy!"
